data_flow:
  - Rehydrate from map, handoff, system map, implementation plan, and `npm run state:status`.
  - Work one bounded organ.
  - Verify the seam that matters.
  - Add distilled evidence only when future belief changes.
  - Steward memory: keep the smallest correct persistent surface current and cut stale steering when it slows re-entry.
  - Commit and push completed work.
  - If state grows faster than understanding, cut it back.

current_status:
  summary: Ghostlight's generic consumer boundary admits sparse WorldSeeds without forged civic runtime state, validates externally owned subject snapshots against the resulting world, runs the same hundreds-class parallel cell machinery used by Dungeon, and exposes an authority-gated newspaper projection over committed NewsIssue rows whose exact cited Events expose the same public channel. The v2 newspaper path gives story selection, grouping, tone, and reader-facing copy to a bounded model editor, admits that draft through a local contract and a separate grounding copy desk, persists successful and terminally rejected editorial receipts, and renders reader copy separately from the provenance audit. Sparse inhabited places compile a versioned civic apparatus and later passes deepen that exact apparatus. Local acceptance proves 1,000 subjects across 200 concurrently dispatched cells, two-wave durable named-person emergence and action, semantic civic receipt binding, and continuing public civic knowledge. Sustained provider acceptance against Ghostlight source 5e00a7bbc3f540ef35d18abe89f84687b5004664 through Codex Connector 2f29b90eebd8fc1bbdc07cdd22ac4883f16849a5 using gpt-5.6-luna advanced one Rainless Marches campaign through four sequential atomic waves from revision 0 to 4. It committed 41 unique events and 28 unique news rows, rendered 23 distinct provenance-bound articles across four issues, carried Ilyra Quill through every issue and Mara's testimony into later institutional postures, retained one rejected pre-commit pulse, and left player state and location unchanged. Full receipts, newspapers, state, provenance, and hashes live in the accepted evidence record and F:\GameCult\GhostlightDungeon\acceptance\rainless-spicy-20260827-sustained-5\SHA256SUMS. This proves sustained politics in a sparse provider world whose derived cover grew from four cells to six as named figures emerged, not a live 200-cell provider wave or the Delvehold game-side adapter. The issue review established political continuity and provenance only; a blind baseline reviewer immediately recognized the old deterministic Markdown as a simulation ledger rather than plausible in-world journalism. Yggdrasil still serves immutable Ghostlight release fdb6352e0dfdd0eeb129020ea9dea0b6225eccf9; Dungeon play remains regression pressure, and unpublished Mars and Kalsa destination previews remain unapproved.
  next_action: Treat the accepted sustained Rainless witness as the provider world-simulation baseline, not the newspaper-presentation baseline. Produce one fantasy newspaper front page grounded in committed public events but written and arranged as plausible in-world journalism. Dispatch an independent reviewer with only that front page and a neutral reader/editor brief that does not mention Ghostlight, simulation, provenance, or procedural generation. Record whether the reviewer independently diagnoses procedural construction and whether the page reads as coherent, selective, opinionated journalism. Separately verify that editorialization remains traceable to committed public evidence and invents no canonical facts. Resume the Delvehold adapter through generic contracts after this presentation boundary passes.
  gestalt_population: Gestalt Personas own shared population baselines; persistent member deltas own named individuality; WorldKernel materialization and approval-gated fission preserve lineage and identity. Materialisation/folding changes only representation and the exact member delta, advances resolution epoch, and retires the old cover; it has no Gestalt-wide effect authority. Selected actionable member exceptions are mandatory Projector perspective owners, so aggregation cannot silently erase their decision. Presence projection is limited to nearby active leaves and exact-location dormant members, includes reciprocal player relationship evidence, and may propose an earned cast without committing it. Simulation cells are derived covers only.

data_flow:
  - Rehydrate from map, handoff, system map, implementation plan, and `npm run state:status`.
  - Work one bounded organ.
  - Verify the seam that matters.
  - Add distilled evidence only when future belief changes.
  - Steward memory: keep the smallest correct persistent surface current and cut stale steering when it slows re-entry.
  - Commit and push completed work.
  - If state grows faster than understanding, cut it back.

current_status:
  summary: GhostlightDungeon production remains on the verified older Starfire release. The current candidate's provider-backed material-outcome golden completed four waves across budgets 1, 4, 8, and 4 with zero rejected pulses, ten durable consequences, seven typed material activity outcomes, exact member binding, no player mutation, and the same Mira returning with persistent state. A selective independent verifier now protects high-risk custody, relation, and named-member private effects without taxing every low-risk preparation.
  next_action: Rebuild and deploy the candidate after demoting unavailable Odin rendezvous from daemon-liveness authority, then repeat authenticated browser, restart, served-commit, and persistence checks. Force one live high-risk outcome-verifier witness before broad human playtesting; continue measuring composite consequences, retries, cache hits, and dramatic yield per token.
  gestalt_population: Gestalt Personas own shared population baselines; persistent member deltas own named individuality; WorldKernel materialization and approval-gated fission preserve lineage and identity. Presence projection is limited to nearby active leaves and exact-location dormant members, includes reciprocal player relationship evidence, and may propose an earned cast without committing it. Simulation cells are derived covers only.
